# Challenge ràpid per fer proves mentre desenvolupeu: 8x8, 200 ms, 10 obertures x 2 colors = 20 partides (~3 min).
# Jocs ràpids: prova-10, prova-25 i prova-50 (els 10 primers de tots tres són els mateixos). No coincideixen amb els del benchmark.
# Copieu aquest fitxer i canvieu-hi el que vulgueu: rivals, mida, temps, obertures...
#
# Jugadors possibles (playerA / playerB):
#   random | profe1
#   edu.upc.epsevg.prop.bombardment.player.MyPlayer            (la vostra classe)
#   edu.upc.epsevg.prop.bombardment.player.MyPlayer(4,true)    (amb arguments per al constructor)
#   nom=classe(...)                                            (etiqueta curta per als informes)
#   jar:ruta/al/jugador.jar                                    (un jugador empaquetat, p.ex. d'un altre equip)
name=exemple
playerA=edu.upc.epsevg.prop.bombardment.player.MyPlayer
playerB=profe1
size=8
timeMs=200
# Marge després de timeout() abans de matar el procés i perdre la partida (competició: 100; 1000 a les 3 primeres jugades de cada procés)
graceMs=100
openings=../openings/prova-10-8x8.txt
# Amb openings.count=N i un fitxer, només es juguen les N primeres obertures (proves ràpides).
# O bé, sense fitxer (esborreu la línia openings=), obertures generades:
# openings.count=20
# openings.plies=2
# openings.seed=1
parallel=1
output=../results
