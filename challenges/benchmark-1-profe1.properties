# BENCHMARK OFICIAL 1: el vostre jugador contra el profe de nivell 1 (heurística simple).
# 100 obertures x 2 colors = 200 partides. Per a la nota es fa amb aquesta configuració, però el joc d'obertures es pot canviar.
name=benchmark-1-profe1
playerA=edu.upc.epsevg.prop.bombardment.player.MyPlayer
playerB=profe1
size=8
timeMs=200
# Marge després de timeout() abans de matar el procés i perdre la partida (competició: 100; 1000 a les 3 primeres jugades de cada procés)
graceMs=100
openings=../openings/benchmark-A-8x8.txt
# Partides simultànies: com a molt (nuclis físics / 2). Amb 1 els resultats són més fiables.
parallel=1
output=../results
