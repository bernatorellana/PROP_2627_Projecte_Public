# VALIDACIÓ DEL BENCHMARK 1: mateixa configuració que el benchmark 1, però amb 100 obertures diferents.
# Serveix per detectar sobreajustament: si el resultat aquí és clarament pitjor que amb benchmark-A, la vostra heurística està ajustada a aquelles obertures. No compta per a la nota.
name=benchmark-validacio-1-profe1
playerA=edu.upc.epsevg.prop.bombardment.player.MyPlayer
playerB=profe1
size=8
timeMs=200
# Marge després de timeout() abans de matar el procés i perdre la partida (competició: 100; 1000 a les 3 primeres jugades de cada procés)
graceMs=100
openings=../openings/benchmark-B-8x8.txt
# Partides simultànies: com a molt (nuclis físics / 2). Amb 1 els resultats són més fiables.
parallel=1
output=../results
